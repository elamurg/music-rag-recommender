name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify imports
        run: |
          python -c "from src.corpus.db import get_conn"
          python -c "from src.embedding.synthesise import synthesise_document"
          python -c "from src.retrieval.query import retrieve"
          python -c "from src.generation.generate import generate_recommendations"